name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 */5 * *' # Every 5 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s --max-time 30 "${{ secrets.SUPABASE_URL }}/rest/v1/roles?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
