name: Deploy Provatferi (dashboard + recruitment, single Worker)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/dashboard/package-lock.json
            apps/recruitment/package-lock.json

      - name: Install root dependencies (Worker bundling)
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix apps/dashboard

      - name: Install recruitment dependencies
        run: npm ci --prefix apps/recruitment

      - name: Build dashboard (static export → apps/dashboard/out)
        run: npm run build:dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://home.provatferi2009.workers.dev
          NEXT_PUBLIC_RECRUITMENT_URL: /recruitment/
          NEXT_PUBLIC_CONTACT_EMAIL: provatferi2009@gmail.com
          NEXT_PUBLIC_CONTACT_PHONE: +880 1839-858853
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Build recruitment (static export → apps/recruitment/out)
        run: npm run build:recruitment

      - name: Assemble single-asset tree (dist/)
        run: npm run assemble

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Runtime secrets for /api/recruitment/submit (Google Sheet + Drive).
      # Set these once in GitHub repo secrets; re-applied on every deploy.
      - name: Apply Worker secrets
        run: |
          printf '%s' "$APPS_SCRIPT_URL" | npx wrangler secret put APPS_SCRIPT_URL
          printf '%s' "$GOOGLE_SHEET_ID" | npx wrangler secret put GOOGLE_SHEET_ID
          printf '%s' "$GOOGLE_DRIVE_FOLDER_ID" | npx wrangler secret put GOOGLE_DRIVE_FOLDER_ID
          if [ -n "$SENTRY_DSN" ]; then printf '%s' "$SENTRY_DSN" | npx wrangler secret put SENTRY_DSN; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
